<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>光合作用互動教學</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #123324;
      --deep: #1a4230;
      --cream: #1a332a;
      --amber: #b57a22;
      --light: #edf2ef;
      --surface: #ffffff;
      --text: #222b25;
      --text-muted: #556b60;
      --shadow: rgba(18, 51, 36, 0.06);
      --border: rgba(18, 51, 36, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Noto Sans TC', sans-serif;
      background: #ffffff;
      color: var(--text);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .container {
      width: min(1200px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }
    .hero {
      background: linear-gradient(135deg, #f4f8f6 0%, #edf3f0 100%);
      border: 1px solid rgba(18, 51, 36, 0.05);
      border-radius: 28px;
      padding: 3rem 2rem;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px var(--shadow);
    }
    .hero::after {
      content: '☘️';
      position: absolute;
      font-size: 4rem;
      top: 1.5rem;
      right: 1.5rem;
      animation: sway 4s ease-in-out infinite;
      transform-origin: center 120%;
      opacity: 0.8;
    }
    @keyframes sway {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(8deg); }
      50% { transform: rotate(-6deg); }
      75% { transform: rotate(5deg); }
    }
    .hero h1 {
      margin: 0 0 1rem;
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(2.8rem, 5vw, 4.8rem);
      letter-spacing: 0.05em;
      color: var(--dark);
    }
    .hero p {
      max-width: 760px;
      line-height: 1.8;
      font-size: 1.05rem;
      color: var(--text-muted);
    }
    .banner {
      margin: 2.5rem 0;
      padding: 1.5rem 2rem;
      background: #edf5f1;
      border: 1px solid rgba(18, 51, 36, 0.05);
      border-radius: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(1.45rem, 2vw, 2rem);
      letter-spacing: 0.06em;
      color: var(--dark);
      box-shadow: 0 8px 24px var(--shadow);
    }
    .section-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 1.6rem;
      margin-bottom: 1rem;
      color: var(--amber);
      font-weight: 700;
    }
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.4rem;
      margin-bottom: 2rem;
    }
    .card {
      background: #f8faf9;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.6rem;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 20px rgba(18, 51, 36, 0.02);
    }
    .card:hover,
    .card.active {
      transform: translateY(-6px);
      border-color: var(--amber);
      background: var(--surface);
      box-shadow: 0 12px 30px rgba(18, 51, 36, 0.08);
    }
    .card span {
      display: inline-flex;
      padding: .35rem .75rem;
      border-radius: 999px;
      background: rgba(181, 122, 19, 0.08);
      color: var(--amber);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      font-weight: 500;
    }
    .card h3 {
      margin: 0 0 .75rem;
      font-size: 1.2rem;
      line-height: 1.3;
      color: var(--dark);
    }
    .card p {
      margin: 0;
      line-height: 1.75;
      color: var(--text-muted);
      font-size: 0.98rem;
    }
    .detail-panel {
      min-height: 240px;
      background: #f8faf9;
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 1.8rem;
      overflow: hidden;
      box-shadow: 0 12px 35px var(--shadow);
    }
    .detail-panel.hidden {
      display: none;
    }
    .detail-panel .labels {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.3rem;
    }
    .detail-panel .chip {
      background: #edf2ef;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--dark);
      border: 1px solid rgba(18, 51, 36, 0.05);
      font-weight: 500;
    }
    .detail-panel h4 {
      margin: 0 0 0.9rem;
      font-family: 'Noto Serif TC', serif;
      font-size: 1.25rem;
      color: var(--dark);
    }
    .detail-panel p,
    .detail-panel ul {
      margin: 0;
      color: var(--text);
      line-height: 1.9;
    }
    .detail-panel ul {
      margin-top: 0.8rem;
      padding-left: 1.2rem;
      display: grid;
      gap: 0.65rem;
    }
    .detail-panel li {
      list-style: disc inside;
      font-size: 0.98rem;
    }
    .fade-in {
      animation: fadeIn 0.55s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .quiz {
      margin-top: 2.5rem;
    }
    .quiz .card {
      cursor: default;
    }
    .quiz .card:hover {
      transform: none;
      border-color: var(--border);
      box-shadow: 0 8px 20px rgba(18, 51, 36, 0.02);
    }
    .questions {
      display: grid;
      gap: 1.25rem;
    }
    .question {
      background: #f8faf9;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.4rem 1.4rem 1.2rem;
      box-shadow: 0 6px 18px rgba(18, 51, 36, 0.02);
    }
    .question h5 {
      margin: 0 0 1rem;
      font-size: 1rem;
      color: var(--dark);
    }
    .options {
      display: grid;
      gap: 0.9rem;
    }
    .option {
      background: var(--surface);
      border: 1px solid rgba(18, 51, 36, 0.08);
      border-radius: 999px;
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: all 0.25s ease;
      cursor: pointer;
      /* 重置 button 原生屬性 */
      font-family: inherit;
      font-size: inherit;
      color: var(--text); /* 確保選項文字顏色一致 */
      width: 100%;
      text-align: left;
      outline: none;
      box-shadow: 0 4px 10px rgba(18, 51, 36, 0.01);
    }
    .option:hover {
      border-color: var(--amber);
      background: #fffbf5;
      box-shadow: 0 4px 15px rgba(181, 122, 19, 0.08);
    }
    /* 不論選中、正確或錯誤，文字顏色一律保持為 var(--text)，只改變背景和邊框 */
    .option.selected {
      background: rgba(181, 122, 19, 0.08);
      border-color: var(--amber);
      color: var(--text) !important;
    }
    .option.correct {
      background: #edf8f0;
      border-color: #2e7d32;
      color: var(--text) !important;
    }
    .option.wrong {
      background: #fdf2f2;
      border-color: #c62828;
      color: var(--text) !important;
    }
    .option small {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .option:disabled {
      cursor: not-allowed;
      opacity: 0.85; /* 藉由透明度表現禁用，而非讓瀏覽器強制將字體變灰，維持文字原本的一致顏色 */
      color: var(--text) !important; /* 強制防止部分瀏覽器的 default disabled 覆蓋文字顏色 */
    }
    .feedback {
      margin-top: 0.9rem;
      padding: 0.95rem 1.2rem;
      border-radius: 18px;
      background: #edf2ef;
      border: 1px solid var(--border);
      color: var(--text);
      line-height: 1.7;
      font-size: 0.95rem;
    }
    .score-panel {
      margin-top: 1.5rem;
      padding: 1.6rem;
      border-radius: 26px;
      background: #edf5f1;
      border: 1px solid rgba(18, 51, 36, 0.08);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px var(--shadow);
    }
    .score-panel strong {
      font-size: 1.2rem;
      color: var(--amber);
    }
    .score-panel button {
      border: none;
      color: #ffffff;
      background: var(--dark);
      font-weight: 700;
      border-radius: 999px;
      padding: 0.85rem 1.6rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .score-panel button:hover {
      background: var(--deep);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(18, 51, 36, 0.15);
    }
    @media (max-width: 950px) {
      .stage-grid { grid-template-columns: 1fr; }
      .banner { font-size: 1.4rem; }
    }
    @media (max-width: 640px) {
      .container { padding: 1.25rem 0 3rem; }
      .hero { padding: 2.2rem 1.4rem; border-radius: 22px; }
      .hero::after { font-size: 3.2rem; top: 1rem; right: 1rem; }
      .stage-grid { gap: 1rem; }
      .detail-panel { padding: 1.4rem; }
      .question { padding: 1rem 1rem 0.9rem; }
      .option { padding: 0.8rem 0.95rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>光合作用</h1>
      <p>探索綠色植物如何把光能轉換成化學能，從葉綠素吸收光線到製造葡萄糖，再到釋放氧氣的生命奇蹟。</p>
    </section>

    <section class="banner" aria-label="總反應式">
      6CO₂ + 6H₂O + 光能 → C₆H₁₂O₆ + 6O₂
    </section>

    <section>
      <div class="section-title">三大階段</div>
      <div class="stage-grid" id="stageGrid">
        <article class="card active" data-stage="1">
          <span>Stage 01</span>
          <h3>光反應（類囊體膜）</h3>
          <p>葉綠素吸收光能、光解水、產生 ATP 與 NADPH、釋放 O₂。</p>
        </article>
        <article class="card" data-stage="2">
          <span>Stage 02</span>
          <h3>卡爾文循環（葉綠體基質）</h3>
          <p>CO₂ 固定、RuBisCO 酵素參與反應，產生 G3P 作為碳骨架。</p>
        </article>
        <article class="card" data-stage="3">
          <span>Stage 03</span>
          <h3>葡萄糖合成（最終產物）</h3>
          <p>G3P 合成葡萄糖，供植物製造澱粉、脂肪與其他碳水化合物。</p>
        </article>
      </div>
      <div class="detail-panel fade-in" id="detailPanel">
        <div class="labels" id="detailLabels"></div>
        <h4 id="detailTitle"></h4>
        <p id="detailText"></p>
      </div>
    </section>

    <section class="quiz">
      <div class="section-title">小測驗</div>
      <div class="questions" id="quizContainer"></div>
      <div class="score-panel" id="scorePanel" style="display:none;">
        <div>
          <strong id="scoreText"></strong>
          <div id="encouragement"></div>
        </div>
        <button id="retryButton">再試一次</button>
      </div>
    </section>
  </main>

  <script>
    const stages = {
      1: {
        title: '光反應（類囊體膜）',
        labels: ['條件：光能', '場所：類囊體膜', '產物：ATP / NADPH / O₂'],
        text: `<ul>
          <li>葉綠素吸收光能 → 儲存在高能電子中，傳遞至電子傳遞鏈。</li>
          <li>光解水（H₂O）→ 拆解為 H⁺、電子與 O₂，O₂ 釋放至大氣。</li>
          <li>產生 ATP → 電子傳遞鏈驅動 ATP 合成酶，ATP 儲存在葉綠體基質。</li>
          <li>產生 NADPH → NADP⁺ 還原為 NADPH，儲存在葉綠體基質。</li>
          <li>釋放 O₂ → 光解水的副產品，排至大氣。</li>
        </ul>`
      },
      2: {
        title: '卡爾文循環（葉綠體基質）',
        labels: ['條件：ATP + NADPH', '場所：葉綠體基質', '產物：G3P'],
        text: `<ul>
          <li>CO₂ 固定 → 與五碳化合物 RuBP 結合。</li>
          <li>RuBisCO 酵素催化 → 催化 CO₂ 與 RuBP 的結合反應。</li>
          <li>產生三碳化合物（3-PGA）→ 分解為兩分子三碳化合物。</li>
          <li>消耗 ATP 與 NADPH → 將 3-PGA 還原為 G3P。</li>
          <li>產生 G3P → 儲存在葉綠體基質，是葡萄糖合成的直接前驅物。</li>
          <li>RuBP 再生 → 部分 G3P 消耗 ATP 重新合成 RuBP，循環持續進行。</li>
        </ul>`
      },
      3: {
        title: '葡萄糖合成（最終產物）',
        labels: ['條件：G3P 累積', '場所：葉綠體基質', '產物：葡萄糖 / 澱粉 / 脂肪 / 蔗糖 / 胺基酸'],
        text: `<ul>
          <li>G3P 縮合 → 兩分子 G3P（三碳）縮合成一分子葡萄糖（六碳）。</li>
          <li>葡萄糖暫存 → 短期儲存在葉綠體基質，隨後輸出至細胞質。</li>
          <li>合成澱粉 → 聚合後儲存在葉綠體的澱粉粒（長期儲存）。</li>
          <li>合成蔗糖 → 在細胞質中轉為蔗糖，透過韌皮部輸送至全株。</li>
          <li>合成脂肪 → G3P 進入脂肪酸合成路徑，儲存在油脂體。</li>
          <li>合成胺基酸 → 結合氮素後合成胺基酸，進一步組成蛋白質。</li>
        </ul>`
      }
    };

    const detailLabels = document.getElementById('detailLabels');
    const detailTitle = document.getElementById('detailTitle');
    const detailText = document.getElementById('detailText');
    const detailPanel = document.getElementById('detailPanel');
    const cards = document.querySelectorAll('.card[data-stage]');

    function showStage(stageId) {
      const stage = stages[stageId];
      if (!stage) return;
      cards.forEach(card => {
        card.classList.toggle('active', card.dataset.stage === String(stageId));
      });
      detailLabels.innerHTML = stage.labels.map(label => `<span class="chip">${label}</span>`).join('');
      detailTitle.textContent = stage.title;
      detailText.innerHTML = stage.text;
      detailPanel.classList.remove('hidden');
      detailPanel.classList.remove('fade-in');
      void detailPanel.offsetWidth;
      detailPanel.classList.add('fade-in');
    }

    cards.forEach(card => {
      card.addEventListener('click', () => showStage(card.dataset.stage));
    });

    showStage(1);

    const quizContainer = document.getElementById('quizContainer');
    const scorePanel = document.getElementById('scorePanel');
    const scoreText = document.getElementById('scoreText');
    const encouragement = document.getElementById('encouragement');
    const retryButton = document.getElementById('retryButton');

    const questions = [
      {
        question: '光反應最主要發生在植物哪個結構？',
        choices: ['葉綠體基質', '類囊體膜', '細胞質基質', '葉肉細胞細胞壁'],
        answer: 1,
        explanation: '光反應發生在葉綠體的類囊體膜上，葉綠素嵌入於此膜中吸收光能。'
      },
      {
        question: '下列哪一個是光合作用的總反應式？',
        choices: ['6CO₂ + 6H₂O + 光能 → C₆H₁₂O₆ + 6O₂', 'C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O', '6CO₂ + 6O₂ → C₆H₁₂O₆ + 6H₂O', '6H₂O + 6O₂ → C₆H₁₂O₆ + 6CO₂'],
        answer: 0,
        explanation: '正確的光合作用總反應式是用二氧化碳、水和光能合成葡萄糖並釋放氧氣。'
      },
      {
        question: '卡爾文循環中最先被固定的物質是？',
        choices: ['H₂O', 'O₂', 'CO₂', 'G3P'],
        answer: 2,
        explanation: '卡爾文循環的第一步是將 CO₂ 固定到有機分子上，這個步驟由 RuBisCO 催化。'
      },
      {
        question: '光反應直接產生下列哪一項？',
        choices: ['葡萄糖', 'ATP 與 NADPH', 'RuBisCO', '澱粉'],
        answer: 1,
        explanation: '光反應產生 ATP 和 NADPH，供卡爾文循環合成葡萄糖使用。'
      },
      {
        question: '光合作用釋放的 O₂ 主要來自哪個來源？',
        choices: ['CO₂ 分解', '光能轉換', '水分子光解', '葡萄糖分解'],
        answer: 2,
        explanation: '光合作用中 O₂ 來源於光解水，水分子被分解成氧氣、電子和質子。'
      }
    ];

    let answeredCount = 0;
    let score = 0;

    function createQuiz() {
      quizContainer.innerHTML = '';
      answeredCount = 0;
      score = 0;
      scorePanel.style.display = 'none';
      encouragement.textContent = '';

      questions.forEach((item, index) => {
        const questionEl = document.createElement('div');
        questionEl.className = 'question';
        questionEl.innerHTML = `<h5>${index + 1}. ${item.question}</h5><div class="options"></div>`;
        const optionsEl = questionEl.querySelector('.options');

        item.choices.forEach((choice, choiceIndex) => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'option';
          option.innerHTML = `<span>${choice}</span><small></small>`;
          option.addEventListener('click', () => selectAnswer(index, choiceIndex, option, questionEl, item));
          optionsEl.appendChild(option);
        });

        quizContainer.appendChild(questionEl);
      });
    }

    function selectAnswer(questionIndex, choiceIndex, optionEl, questionEl, item) {
      if (questionEl.dataset.answered) return;
      questionEl.dataset.answered = 'true';
      answeredCount++;
      const isCorrect = choiceIndex === item.answer;
      if (isCorrect) { score++; optionEl.classList.add('correct'); }
      else { optionEl.classList.add('wrong'); }
      optionEl.classList.add('selected');
      const options = questionEl.querySelectorAll('.option');
      options.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) btn.classList.add('correct');
      });
      const feedback = document.createElement('div');
      feedback.className = 'feedback';
      feedback.textContent = isCorrect ? `答對！${item.explanation}` : `答錯。${item.explanation}`;
      questionEl.appendChild(feedback);
      if (answeredCount === questions.length) showScore();
    }

    function showScore() {
      scorePanel.style.display = 'flex';
      scoreText.textContent = `得分：${score} / ${questions.length}`;
      const rate = score / questions.length;
      encouragement.textContent = rate >= 0.8 ? '太棒了！你已經掌握光合作用的關鍵步驟。' : rate >= 0.6 ? '很好！再複習一次可以更穩固概念。' : '加油！再重新作答一次，你會更清楚光合作用流程。';
    }

    retryButton.addEventListener('click', createQuiz);
    createQuiz();
  </script>
</body>
</html>
